name: drainage
description: "Drainage reporting app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  supabase_flutter: ^2.16.0
  geolocator: ^14.0.3
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/drainage.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/clogged_drain.png
    - assets/drainage.png
    - assets/drainage_clean.png
    - assets/drain_alert_logo.png
    - assets/icon_report_issue.png
    - assets/icon_my_reports.png
    - assets/icon_notifications.png
    - assets/icon_logout.png
